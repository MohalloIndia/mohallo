<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" width="100%" height="100%" fill="none" style="overflow: visible;">
  <defs>
    <!-- Drop shadow for the chalkboard easel -->
    <filter id="easel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- 1. MAIN BUILDING FACADE (Warm Golden Amber) -->
  <rect x="52" y="240" width="414" height="240" rx="3" fill="#F29F02" />

  <!-- 2. LARGE DISPLAY WINDOW (Left) -->
  <!-- Dark navy frame -->
  <rect x="75" y="272" width="202" height="148" rx="2" fill="#072E36" />
  <!-- Cream glass pane -->
  <rect x="85" y="285" width="182" height="122" rx="1" fill="#EBD5C4" />
  <!-- Glass reflection strokes -->
  <path d="M140 376 L195 320" stroke="#072E36" stroke-width="4.5" stroke-linecap="round" />
  <path d="M172 364 L188 348" stroke="#072E36" stroke-width="4.5" stroke-linecap="round" />

  <!-- 3. SHOP DOOR (Right) -->
  <!-- Teal Door -->
  <rect x="306" y="268" width="112" height="212" rx="2" fill="#5BA698" />
  <!-- Door Glass Window (Cream) -->
  <rect x="320" y="286" width="84" height="86" rx="1" fill="#EBD5C4" />
  <!-- Door knob -->
  <circle cx="316" cy="378" r="4.5" fill="#072E36" />

  <!-- Hanging "OPEN" Sign inside Door Window -->
  <!-- String hanger -->
  <path d="M346 322 L362 304 L378 322" stroke="#072E36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Yellow Sign Board -->
  <rect x="332" y="320" width="60" height="24" rx="3" fill="#F29F02" />
  <!-- "OPEN" Text -->
  <text x="362" y="336" fill="#072E36" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10.5" letter-spacing="1.2" text-anchor="middle">OPEN</text>

  <!-- 4. SIDEWALK CHALKBOARD SIGN (Easel) -->
  <g filter="url(#easel-shadow)">
    <!-- Back support leg -->
    <path d="M472 430 L496 502" stroke="#072E36" stroke-width="9" stroke-linecap="round" />
    <path d="M464 452 L484 480" stroke="#F29F02" stroke-width="4.5" stroke-linecap="round" />
    <!-- Front board face -->
    <polygon points="440,422 482,422 468,500 418,500" fill="#072E36" />
    <!-- Chalkboard legs -->
    <path d="M424 496 L414 502" stroke="#072E36" stroke-width="8" stroke-linecap="round" />
    <path d="M462 496 L456 502" stroke="#072E36" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- 5. AWNING (Scalloped Canopy) -->
  <!-- Upper Slanted Canopy Background -->
  <!-- Left curved return flap (Red) -->
  <path d="M64 125 L24 178 C20 200 24 230 42 245 C56 255 64 246 64 238 Z" fill="#F2532E" />
  <!-- Right curved return flap (Red) -->
  <path d="M454 125 L494 178 C498 200 494 230 476 245 C462 255 454 246 454 238 Z" fill="#F2532E" />

  <!-- 5 Front Awning Stripes (Upper Slanted Section) -->
  <!-- 1. Left Stripe (Red) -->
  <polygon points="64,125 142,125 142,185 64,185" fill="#F2532E" />
  <!-- 2. Cream Stripe -->
  <polygon points="142,125 220,125 220,185 142,185" fill="#EBD5C4" />
  <!-- 3. Center Stripe (Red) -->
  <polygon points="220,125 298,125 298,185 220,185" fill="#F2532E" />
  <!-- 4. Cream Stripe -->
  <polygon points="298,125 376,125 376,185 298,185" fill="#EBD5C4" />
  <!-- 5. Right Stripe (Red) -->
  <polygon points="376,125 454,125 454,185 376,185" fill="#F2532E" />

  <!-- Awning Horizontal Crease Line -->
  <line x1="24" y1="185" x2="494" y2="185" stroke="#072E36" stroke-width="2.5" opacity="0.4" />

  <!-- 5 Hanging Scallops (Front Valance) -->
  <!-- Scallop 1 (Left - Red) -->
  <path d="M64 185 L64 200 C64 242 142 242 142 200 L142 185 Z" fill="#F2532E" />
  <!-- Scallop 2 (Cream) -->
  <path d="M142 185 L142 200 C142 242 220 242 220 200 L142 185 Z" fill="#EBD5C4" />
  <!-- Scallop 3 (Center - Red) -->
  <path d="M220 185 L220 200 C220 242 298 242 298 200 L220 185 Z" fill="#F2532E" />
  <!-- Scallop 4 (Cream) -->
  <path d="M298 185 L298 200 C298 242 376 242 376 200 L298 185 Z" fill="#EBD5C4" />
  <!-- Scallop 5 (Right - Red) -->
  <path d="M376 185 L376 200 C376 242 454 242 454 200 L454 185 Z" fill="#F2532E" />

  <!-- 6. TOP SIGNBOARD ("SHOP") -->
  <!-- Teal outer rounded rectangle -->
  <rect x="94" y="28" width="330" height="98" rx="18" fill="#5BA698" />
  <!-- Cream inner rounded rectangle -->
  <rect x="108" y="42" width="302" height="70" rx="10" fill="#EBD5C4" />

  <!-- Stylized "SHOP" Letters (Hand-lettered vector strokes matching user artwork) -->
  <!-- Letter S -->
  <path d="M178 64 C174 57 165 54 156 56 C144 59 142 70 148 76 C158 84 179 84 179 97 C179 107 167 112 153 111 C142 110 135 103 133 97" stroke="#072E36" stroke-width="13" stroke-linecap="round" fill="none" />
  
  <!-- Letter H -->
  <path d="M214 55 L214 110 M254 55 L254 110 M214 82 L254 82" stroke="#072E36" stroke-width="13" stroke-linecap="round" fill="none" />

  <!-- Letter O -->
  <ellipse cx="304" cy="82" rx="20" ry="27" stroke="#072E36" stroke-width="13" stroke-linecap="round" fill="none" />

  <!-- Letter P -->
  <path d="M358 55 L358 110 M358 55 L378 55 C392 55 398 65 398 75 C398 86 390 94 378 94 L358 94" stroke="#072E36" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
